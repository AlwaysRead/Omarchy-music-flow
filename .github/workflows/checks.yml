name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install QML syntax checker
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools
      - name: Unit and deployment tests
        run: |
          node --test tests/*.test.cjs
          python3 tests/deployment.test.py
      - name: Syntax checks
        run: |
          /usr/lib/qt5/bin/qmllint BarWidget.qml Service.qml
          node --check AudioSpectrum.js
          node --check MediaModel.js
          bash -n install.sh update.sh uninstall.sh scripts/install_files.sh
          python3 -m py_compile scripts/configure_bar.py tests/*.py
      - name: Whitespace checks
        run: git diff --check
